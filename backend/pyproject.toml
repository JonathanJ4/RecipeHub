[project]
name = "recipe-hub-api"
version = "0.1.0"
description = "FastAPI and PostgreSQL backend for Recipe Hub"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi[standard]>=0.116.1,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

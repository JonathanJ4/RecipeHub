[project]
name = "recipe-hub-api"
version = "0.1.0"
description = "FastAPI and PostgreSQL backend for Recipe Hub"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi[standard]>=0.116.1,<1.0",
    "pgvector>=0.4,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "sentence-transformers>=2.7,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=4.51,<5.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
